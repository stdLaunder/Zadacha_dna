 <circle cx="190" cy="295" r="68" stroke="#93949b" stroke-width="2.7"/>
 <circle cx="164.4" cy="235.8" r="65.8" stroke="#888b94" stroke-width="2.7" stroke-dasharray="8 8"/>
 <path d="M139 175 L190 363" stroke="#6d7079" stroke-width="2.3"/>
 <path d="M113 363 L230 241" stroke="#6d7079" stroke-width="2.3"/>
 <path d="M395 363 L124 286" stroke="#6d7079" stroke-width="2.3"/>
</g>
