 <g fill="#236ca9"><text x="143" y="167">A</text><text x="99" y="356">B</text><text x="399" y="357">C</text></g>
 <g fill="#555a63"><text x="197" y="361">D</text><text x="235" y="237">E</text><text x="109" y="280">F</text><text x="180" y="314">G</text><text x="196" y="289">I</text><text x="159" y="230">Fe</text></g>
