<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 146 360 240" role="img" aria-labelledby="title description">
<title id="title">Схема к задаче 10.3 олимпиады Шарыгина</title>
<desc id="description">Треугольник ABC с вписанной окружностью. D на BC, E на AC, F на AB — точки касания. AA', BB', CC' пересекаются в точке G; отмечены инцентр I и точка Фейербаха Fe. Пунктиром показана вспомогательная окружность на исходном чертеже.</desc>
